name: Проверка и публикация еНорматив

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - .node-version
      - .env.example
      - web/**

permissions: {}

concurrency:
  group: enormativ-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://enormativ.ru
    permissions:
      contents: read
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Настроить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Установить зависимости
        run: npm --prefix web ci --no-audit --no-fund
      - name: Проверить правила
        run: npm --prefix web test
      - name: Собрать статический сайт
        run: npm --prefix web run build
      - name: Загрузить результат сборки
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Опубликовать результат сборки
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
